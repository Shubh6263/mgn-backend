services:
  postgres:
    image: postgres:16-alpine
    container_name: mgn_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mgn_user
      POSTGRES_PASSWORD: mgn_password
      POSTGRES_DB: medglobalnetwork
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d

volumes:
  postgres_data:
